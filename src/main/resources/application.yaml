server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: offer-service

  h2:
    console:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.h2.Driver
#    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/offerdb}
#    username: ${SPRING_DATASOURCE_USERNAME:OFFER_USER}
#    password: ${SPRING_DATASOURCE_PASSWORD:offer_password}
#    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    pl.easyoffer.offer_service: INFO

service:
  justJoinIt-service: "https://justjoin.it/"
