server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: offer-service

  h2:
    console:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/offerdb}
    username: ${SPRING_DATASOURCE_USERNAME:offer_user}
    password: ${SPRING_DATASOURCE_PASSWORD:offer_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    pl.easyoffer.offer_service: INFO

scheduler:
  offer-synchronization:
    cron: ${OFFER_SYNC_CRON:0 0 4 * * *}
    zone: ${OFFER_SYNC_ZONE:Europe/Warsaw}

service:
  justJoinIt-service: ${JUSTJOINIT_SERVICE_URL:https://justjoin.it/}
  theProtocolIt-service: ${THEPROTOCOLIT_SERVICE_URL:https://theprotocol.it/}
  nofluffjobs-service: ${NOFLUFFJOBS_SERVICE_URL:https://nofluffjobs.com}

feature:
  just-join-it-synchronizer-enabled: ${JUST_JOIN_IT_SYNCHRONIZER_ENABLED:true}
  the-protocol-it-synchronizer-enabled: ${THE_PROTOCOL_IT_SYNCHRONIZER_ENABLED:true}
  nofluffjobs-synchronizer-enabled: ${NOFLUFFJOBS_SYNCHRONIZER_ENABLED:false}

dataset:
  export:
    enabled: ${DATASET_EXPORT_ENABLED:true}
    directory: ${DATASET_EXPORT_DIRECTORY:./data/datasets}
    api-key: ${DATASET_EXPORT_API_KEY:}
