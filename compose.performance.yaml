name: easyoffer-f016

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: offerdb_performance
      POSTGRES_USER: offer_performance
      POSTGRES_PASSWORD: offer_performance
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offer_performance -d offerdb_performance"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
