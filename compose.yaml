services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: offerdb
      POSTGRES_USER: offer_user
      POSTGRES_PASSWORD: offer_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offer_user -d offerdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - offer-postgres-data:/var/lib/postgresql/data

volumes:
  offer-postgres-data:
